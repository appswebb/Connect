name: Generate and commit npm lockfile

on:
  push:
    branches: ["rebuild/connect-visual-2"]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve exact dependency tree without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit lockfile if it changed
        run: |
          if [ -z "$(git status --porcelain package-lock.json)" ]; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: commit reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
