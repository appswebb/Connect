name: Build CONNECT Android APK

on:
  workflow_run:
    workflows: ["Deploy CONNECT to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: connect-android-release
  cancel-in-progress: false

jobs:
  build-apk:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Android signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.CONNECT_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CONNECT_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.CONNECT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CONNECT_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gerando APK de instalação assinado com a chave de depuração do Android. Para atualizações sem reinstalar, configure a chave permanente de publicação."
          fi

      - name: Checkout latest CONNECT
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies and export web app
        run: |
          npm install
          npm run build

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "0.2.${{ github.run_number }}"/' android/app/build.gradle

      - name: Apply official CONNECT launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$density" in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            rsvg-convert -w "$size" -h "$size" public/icons/connect.svg -o "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

      - name: Build signed Android release
        if: steps.signing.outputs.ready == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign and verify release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.CONNECT_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CONNECT_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.CONNECT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CONNECT_ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/connect-release.jks"
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -v 4 "$APK" "$RUNNER_TEMP/CONNECT-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/connect-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out CONNECT.apk "$RUNNER_TEMP/CONNECT-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose CONNECT.apk

      - name: Build installable APK without release key
        if: steps.signing.outputs.ready != 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../CONNECT.apk

      - name: Publish APK and update notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v0.2.${{ github.run_number }}
          name: CONNECT v0.2.${{ github.run_number }}
          body: |
            Atualização automática do aplicativo CONNECT.

            Alteração publicada no site: ${{ github.event.workflow_run.head_commit.message }}

            O aplicativo usa a versão oficial do site e recebe as mudanças do sistema assim que são publicadas.
            ${{ steps.signing.outputs.ready == 'true' && 'APK assinado com a chave permanente de publicação.' || 'APK de instalação assinado em modo de depuração. Para instalar esta atualização sobre uma versão anterior, é necessário desinstalar a versão anterior primeiro. A chave permanente de publicação ainda precisa ser configurada para permitir atualizações diretas.' }}
          files: CONNECT.apk
          make_latest: true
