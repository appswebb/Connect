name: Deploy CONNECT to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Write latest site update metadata
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess
          message = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()
          data = {
              "version": "web-" + os.environ["GITHUB_RUN_NUMBER"],
              "commit": os.environ["GITHUB_SHA"],
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "changes": message
          }
          with open("./out/app-version.json", "w", encoding="utf-8") as file:
              json.dump(data, file, ensure_ascii=False)
          PY
      - name: Verify static export
        run: |
          test -s ./out/index.html
          test -d ./out/_next/static
          find ./out/_next/static -type f -name "*.js" | grep -q .
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
