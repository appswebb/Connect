name: CONNECT pull request build
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify static export
        run: |
          test -s ./out/index.html
          test -d ./out/_next/static
          find ./out/_next/static -type f -name "*.js" | grep -q .
